<!DOCTYPE html>
<meta charset="utf-8">
<body style="background:aliceblue;color:darkslategray;text-align:center;font-family:sans-serif">
<h1 style="color:royalblue">DOT YUNIVERSE</h1>
<div id="g" style="margin-top:40px">
  <button id="b0" style="font-size:22px;padding:14px 30px;margin:8px">日本語 (JP)</button>
  <button id="b1" style="font-size:22px;padding:14px 30px;margin:8px">English (EN)</button>
</div>
<div id="nmV" style="display:none;margin-top:40px">
  <div id="nmT" style="font-size:20px;font-weight:bold;color:royalblue;margin-bottom:10px"></div>
  <input id="pnm" maxlength="12" style="font-size:20px;padding:8px;text-align:center">
  <button id="nmOk" style="font-size:20px;padding:8px 20px;background:royalblue;color:white">OK</button>
</div>
<div id="m" style="display:none">
  <div style="margin:6px"><b id="crB" style="color:crimson"></b> <b id="pInf"></b> [ID:<span id="dId" style="color:royalblue"></span>]</div>
  <div style="color:darkorange;font-weight:bold;font-size:18px;margin:6px">$<b id="mn">0</b></div>
  <div style="margin:6px"><button id="t0"></button> <button id="t1"></button> <button id="cl"></button></div>
  <div style="display:inline-flex;gap:16px;align-items:flex-start">
    <canvas id="c" width="320" height="320" style="border:3px solid royalblue;background:white;cursor:crosshair"></canvas>
    <div style="text-align:left;background:white;padding:12px;border:2px solid lightsteelblue;border-radius:10px">
      <div id="pv" style="width:48px;height:48px;border:2px solid gray;margin-bottom:8px"></div>
      H:<input id="ch" type="range" min="0" max="360" value="200"><br>
      S:<input id="cs" type="range" min="0" max="100" value="100"><br>
      L:<input id="cl2" type="range" min="0" max="100" value="50"><br>
      <button id="sl" style="background:deepskyblue;color:white;font-weight:bold;width:100%;margin-top:10px;padding:8px"></button>
      <div id="ms" style="color:crimson;font-weight:bold;margin-top:6px"></div>
    </div>
  </div>
  <div style="margin-top:10px"><button id="u1"></button></div>
</div>
<script>
var x=c.getContext('2d');
var L=1,tl=0,lv1=1,money=0,isCr=0,crSt=0,dn=0;
function gCol(){return 'hsl('+ch.value+','+cs.value+'%,'+cl2.value+'%)';}
function uCol(){pv.style.background=gCol();}
ch.oninput=cs.oninput=cl2.oninput=uCol;
function sL(l){
  L=l;g.style.display='none';nmV.style.display='block';
  nmT.innerText=L?'名前を入力':'ENTER NAME';
  t0.innerText=L?'ペン':'PEN';
  t1.innerText=L?'消しゴム':'ERASER';
  cl.innerText=L?'全消し':'CLEAR';
  sl.innerText=L?'今すぐ売る':'SELL NOW';
}
b0.onclick=function(){sL(1);};
b1.onclick=function(){sL(0);};
nmOk.onclick=function(){
  var raw=pnm.value.trim();
  if(crSt==0&&raw=='yuaou1024'){crSt=1;pnm.value='';pnm.focus();return;}
  nmV.style.display='none';m.style.display='block';
  isCr=(crSt==1)?1:0;
  if(isCr){lv1=10;crB.innerText=L?'作者':'CREATOR';}
  pInf.innerText=(raw||'PLAYER').slice(0,8);
  dId.innerText=Math.random().toString(36).slice(2,12).toUpperCase();
  uCol();uSh();x.fillStyle='white';x.fillRect(0,0,320,320);
};
function uSh(){
  mn.innerText=isCr?'∞':money;
  u1.innerText=(L?'価格アップ':'PRICE+')+(isCr?'MAX':'Lv'+(lv1+1)+'($'+(lv1*40)+')');
}
t0.onclick=function(){tl=0;};
t1.onclick=function(){tl=1;};
cl.onclick=function(){x.fillStyle='white';x.fillRect(0,0,320,320);};
function drw(e){
  var rc=c.getBoundingClientRect();
  var cx=Math.floor((e.clientX-rc.left)/40)*40;
  var cy=Math.floor((e.clientY-rc.top)/40)*40;
  x.fillStyle=tl==0?gCol():'white';
  x.fillRect(cx,cy,40,40);
}
c.onpointerdown=function(e){dn=1;drw(e);};
c.onpointermove=function(e){if(dn)drw(e);};
c.onpointerup=function(){dn=0;};
sl.onclick=function(){
  var pr=50*lv1;if(!isCr)money+=pr;
  ms.innerText=(L?'売却完了!':'SOLD!')+' +$'+(isCr?'∞':pr);
  x.fillStyle='white';x.fillRect(0,0,320,320);uSh();
};
u1.onclick=function(){
  if(isCr||money>=lv1*40){if(!isCr)money-=lv1*40;lv1++;uSh();}
};
</script>
</body>
