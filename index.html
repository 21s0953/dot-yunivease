<script>
const x = c.getContext('2d'), px = pc.getContext('2d'), tx2 = tc.getContext('2d'), cx3 = cc.getContext('2d');
const SZ = ['8', '12', '16', '32'];
let B = Array.from({length: 8}, () => Array(8).fill(''));
let CB = Array.from({length: 16}, () => Array(16).fill(''));
let tL = 0, bg = 0, bt = 0, ni = 0, lkd = 0, fmd = 0, pmd = 0, sel = 0, inT = 0, lvC = 0, rbH = 0;
let ck1 = 0, ck2 = 0, ck3 = 0, isCr = 0, dnTd = 0, dnDy = 0, aucOn = 0, aucBid = 0, crSt = 0, tl = 0;
let mn = 100, hasPet = 0, gFrmEnd = 0, CARDS = [], uH = [], rH = [];
let txX = 60, txY = 60, txC = 'hsl(200,100%,50%)', auCtx = null;
let zm2 = 1, gd = 1, lv1 = 1, lv2 = 1, mxG = 1, mxB = 2;
let G = [], BG = [], FL = [], USED = [], cx2 = 110, cy2 = 110, dogX = 80, dogY = 110, cstX = 0, pName = '', dotId = '';

const ml = '523,659,784,659,587,698,880,698'.split(',');
const bs2 = '131,196,131,196,147,220,147,220'.split(',');
const pkM = '523,659,784,1047,1047,988,784,659'.split(',');
const RN = ['SORA', 'YUT', 'HARU', 'LUNA', 'KAI'];

const w0 = ['PEN','ERASER','FILL','PICKER','TO BAG','SELL NOW','CLEAR','PRICE+','SPEED+','SHOP SLOT','BAG SLOT','SIZE UP','SOLD!','MOVED!','FULL!','TUTORIAL','SKIP / START','ENTER NAME','CREATOR','WALK(WASD)','DRAW:WASD | Move'];
const w1 = ['ペン','消しゴム','塗りつぶし','スポイト','バッグへ','今すぐ売る','全消し','価格アップ','スピードUP','店枠+1','バッグ+1','サイズ拡大','売れた!','移動した!','いっぱい!','チュートリアル','スキップ / 開始','名前を入力','創造者','歩く(WASD)','描く:WASD | 移動'];
const tx = i => (tL ? w1 : w0)[i];

const gCol = () => `hsl(${ch.value},${cs.value}%,${cl2.value}%)`;
const uCol = () => { pv.style.background = gCol(); };
ch.oninput = cs.oninput = cl2.oninput = uCol;
setInterval(() => { rbH = (rbH + 20) % 360; crB.style.color = `hsl(${rbH},95%,45%)`; }, 60);

const mkDotId = () => {
  const cs2 = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  let id2 = '';
  do {
    id2 = '';
    for (let i = 0; i < 10; i++) id2 += cs2.charAt(Math.floor(Math.random() * cs2.length));
  } while (USED.includes(id2));
  USED.push(id2);
  return id2;
};

const dwT = () => {
  tx2.fillStyle = 'white'; tx2.fillRect(0, 0, 160, 160); tx2.strokeStyle = 'lightgray';
  for (let i = 0; i <= 5; i++) {
    tx2.beginPath(); tx2.moveTo(i * 32, 0); tx2.lineTo(i * 32, 160);
    tx2.moveTo(0, i * 32); tx2.lineTo(160, i * 32); tx2.stroke();
  }
  tx2.fillStyle = txC; tx2.fillRect(txX, txY, 32, 32);
  hb.innerHTML = tL
    ? `<b>チュートリアル</b><br>${ck1 ? '✅' : '⬜'}1. 下のスライダーで色変更<br>${ck2 ? '✅' : '⬜'}2. 枠内をクリック<br>${ck3 ? '✅' : '⬜'}3. WASDで移動`
    : `<b>Try left box!</b><br>${ck1 ? '✅' : '⬜'}1.Color<br>${ck2 ? '✅' : '⬜'}2.Click<br>${ck3 ? '✅' : '⬜'}3.WASD`;
};
tch.oninput = () => { txC = `hsl(${tch.value},100%,50%)`; ck1 = 1; dwT(); };
tc.onclick = e => {
  const rc = tc.getBoundingClientRect();
  txX = Math.floor((e.clientX - rc.left) / 32) * 32;
  txY = Math.floor((e.clientY - rc.top) / 32) * 32;
  ck2 = 1; dwT();
};

const sv = () => {
  const s = JSON.stringify({ mn, lv1, lv2, lvC, mxG, mxB, G, BG, B, FL, pName, dotId, USED, isCr, dnTd, dnDy, hasPet, gFrmEnd, CARDS });
  try { localStorage.setItem('DOT_YUNIVERSE_SAVE', s); } catch (e) {}
  try { window.name = s; } catch (e) {}
};
const getSave = () => {
  try { const s = localStorage.getItem('DOT_YUNIVERSE_SAVE'); if (s && s.startsWith('{')) return JSON.parse(s); } catch (e) {}
  try { if (window.name && window.name.startsWith('{')) return JSON.parse(window.name); } catch (e) {}
  return null;
};

const cVal = item => {
  const a2 = Array.isArray(item) ? item : item.art;
  const isG = item && !Array.isArray(item) && item.gold;
  let cnt = 0; const st2 = new Set();
  a2.forEach(r => r.forEach(v => { if (v) { cnt++; st2.add(v); } }));
  if (cnt === 0) return 0;
  const base = Math.floor((cnt * 3 + st2.size * 12) * lv1);
  return isG ? Math.floor(base * 1.5) : base;
};

const usH = () => {
  document.getElementById('mn').innerText = isCr ? '∞' : Math.floor(mn);
  u1.innerText = `${tx(7)}Lv${lv1} ($${lv1 * 40})`;
  u2.innerText = `${tx(8)}Lv${lv2} ($${lv2 * 60})`;
  u3.innerText = tx(9) + (mxG >= 10 ? '(MAX)' : ` ($${mxG * 100})`);
