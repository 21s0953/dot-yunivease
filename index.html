const mkDotId = () => {
  const cs2 = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  let id2 = '';
  do {
    id2 = '';
    for (let i2 = 0; i2 < 10; i2++) id2 += cs2.charAt(Math.floor(Math.random() * cs2.length));
  } while (USED.includes(id2) || id2 === '2700000AAAAA');
  USED.push(id2);
  return id2;
};

const dwT = () => {
  tx2.fillStyle = 'white';
  tx2.fillRect(0, 0, 160, 160);
  tx2.strokeStyle = 'lightgray';
  for (let i = 0; i <= 5; i++) {
    tx2.beginPath(); tx2.moveTo(i * 32, 0); tx2.lineTo(i * 32, 160);
    tx2.moveTo(0, i * 32); tx2.lineTo(160, i * 32); tx2.stroke();
  }
  tx2.fillStyle = txC;
  tx2.fillRect(txX, txY, 32, 32);
  hb.innerHTML = tL
    ? `<b>チュートリアル</b><br>${ck1 ? '<span style="color:green">✅</span>' : '⬜'}1. 下のスライダーで色変更<br>${ck2 ? '<span style="color:green">✅</span>' : '⬜'}2. 枠内をクリック<br>${ck3 ? '<span style="color:green">✅</span>' : '⬜'}3. WASDで移動`
    : `<b>Try left box!</b><br>${ck1 ? '<span style="color:green">✅</span>' : '⬜'}1.Color<br>${ck2 ? '<span style="color:green">✅</span>' : '⬜'}2.Click<br>${ck3 ? '<span style="color:green">✅</span>' : '⬜'}3.WASD`;
};

tch.oninput = () => { txC = `hsl(${tch.value},100%,50%)`; ck1 = 1; dwT(); };
tc.onclick = e2 => {
  const rc = tc.getBoundingClientRect();
  txX = Math.floor((e2.clientX - rc.left) / 32) * 32;
  txY = Math.floor((e2.clientY - rc.top) / 32) * 32;
  ck2 = 1; dwT();
};

  try { window.name = dataStr; } catch (e) {}
  try { localStorage.setItem('DOT_YUNIVERSE_SAVE', dataStr); } catch (e) {}
};

const getSaveData = () => {
  try {
