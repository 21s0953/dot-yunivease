<!DOCTYPE html><meta charset="utf-8"><body style="background:aliceblue;color:darkslategray;text-align:center;font-family:sans-serif"><h1 style="color:royalblue">DOT YUNIVERSE</h1><div id="g" style="margin-top:40px"><button onclick="start(1)" style="font-size:22px;padding:14px 30px;margin:8px;cursor:pointer">日本語 (JP)</button><button onclick="start(0)" style="font-size:22px;padding:14px 30px;margin:8px;cursor:pointer">English (EN)</button></div><div id="nmV" style="display:none;margin-top:40px"><div id="nmT" style="font-size:20px;font-weight:bold;color:royalblue;margin-bottom:10px"></div><input id="pnm" maxlength="12" style="font-size:20px;padding:8px;text-align:center"> <button onclick="setName()" style="font-size:20px;padding:8px 20px;background:royalblue;color:white;cursor:pointer">OK</button></div>
<div id="m" style="display:none"><div style="margin:6px"><b id="crB"></b> <b id="pInf"></b> [ID:<span id="dId" style="color:royalblue;font-weight:bold"></span>]</div><div style="color:darkorange;font-weight:bold;font-size:18px;margin:6px">$<b id="mn">0</b> <span id="dyB" style="color:royalblue;font-size:14px">Day 1 (10:00)</span></div><div style="margin:6px"><button onclick="tl=0" id="t0"></button> <button onclick="tl=1" id="t1"></button> <button onclick="gd=!gd;dw()">GRID</button> <button onclick="clr()" id="cl"></button></div><div style="display:inline-flex;gap:16px;align-items:flex-start"><canvas id="c" width="320" height="320" style="border:3px solid royalblue;background:white;cursor:crosshair;touch-action:none"></canvas><div style="text-align:left;background:white;padding:12px;border:2px solid lightsteelblue;border-radius:10px"><div id="pv" style="width:48px;height:48px;border:2px solid gray;margin-bottom:8px"></div>H:<input id="ch" type="range" min="0" max="360" value="200" oninput="uCol()"><br>S:<input id="cs" type="range" min="0" max="100" value="100" oninput="uCol()"><br>L:<input id="cl2" type="range" min="0" max="100" value="50" oninput="uCol()"><br><button onclick="sellArt()" id="sl" style="background:deepskyblue;color:white;font-weight:bold;width:100%;margin-top:10px;padding:8px"></button><div id="ms" style="color:crimson;font-weight:bold;margin-top:6px"></div></div></div><div style="margin-top:10px"><button onclick="upPrice()" id="u1"></button> <button onclick="upSize()" id="u5"></button></div></div>
<script>x=c.getContext('2d');SZ=new Array(8,12,16,32);lvC=0;B=Array.from({length:8},()=>Array(8).fill(''));L=1;tl=0;gd=1;lv1=1;money=0;isCr=0;crSt=0;gDay=1;gTm=600;gCol=()=>`hsl(${ch.value},${cs.value}%,${cl2.value}%)`;uCol=()=>{pv.style.background=gCol()};start=l=>{L=l;g.style.display='none';nmV.style.display='block';nmT.innerText=L?'名前を入力':'ENTER NAME';t0.innerText=L?'ペン':'PEN';t1.innerText=L?'消しゴム':'ERASER';cl.innerText=L?'全消し':'CLEAR';sl.innerText=L?'今すぐ売る':'SELL NOW'};setName=()=>{raw=pnm.value.trim();if(crSt==0&&raw=='yuaou1024'){crSt=1;pnm.value='';pnm.focus();return}nmV.style.display='none';m.style.display='block';isCr=(crSt==1)?1:0;if(isCr){lv1=10;lvC=3;B=Array.from({length:32},()=>Array(32).fill(''));crB.innerText=L?'作者':'CREATOR'}pInf.innerText=(raw||'PLAYER').slice(0,8);dId.innerText=Math.random().toString(36).slice(2,12).toUpperCase();uCol();uSh();dw()};uSh=()=>{mn.innerText=isCr?'∞':money;u1.innerText=(L?'価格アップ':'PRICE+')+(isCr?'MAX':`Lv${lv1+1}($${lv1*40})`);u5.innerText=(L?'サイズ拡大':'SIZE UP')+`(${SZ.at(lvC)}x${SZ.at(lvC)}`+(lvC>=3?'(MAX)':`($${(lvC+1)*120})`)+')';dyB.innerText=`Day ${gDay} (${Math.floor(gTm/60)}:${String(gTm%60).padStart(2,'0')})`};setInterval(()=>{if(m.style.display=='block'){gTm--;if(gTm<=0){gDay++;gTm=600;if(!isCr&&money>0){tax=Math.floor(money*0.1);money-=tax;ms.innerText=(L?`Day ${gDay}! 10%徴収(-$${tax})`:`Day ${gDay}! 10% tax(-$${tax})`)}}uSh()}},1000);dw=()=>{n=B.length;sz=320/n;x.fillStyle='white';x.fillRect(0,0,320,320);B.forEach((r,y)=>r.forEach((v,z)=>{if(v){x.fillStyle=v;x.fillRect(z*sz,y*sz,sz,sz)}}));if(gd){x.strokeStyle='lightgray';for(i=0;i<n;i++){x.beginPath();x.moveTo(i*sz,0);x.lineTo(i*sz,320);x.moveTo(0,i*sz);x.lineTo(320,i*sz);x.stroke()}}};dn=0;drw=e=>{n=B.length;rc=c.getBoundingClientRect();sz=320/n;col=Math.floor((e.clientX-rc.left)/sz);row=Math.floor((e.clientY-rc.top)/sz);if(row<0||row>=n||col<0||col>=n)return;B.at(row).splice(col,1,tl==0?gCol():'');dw()};c.onpointerdown=e=>{dn=1;drw(e)};c.onpointermove=e=>{if(dn)drw(e)};c.onpointerup=()=>{dn=0};clr=()=>{n=SZ.at(lvC);B=Array.from({length:n},()=>Array(n).fill(''));dw()};sellArt=()=>{cnt=0;B.forEach(r=>r.forEach(v=>{if(v)cnt++}));if(cnt==0)return;pr=cnt*10*lv1;if(!isCr)money+=pr;ms.innerText=(L?'売却完了!':'SOLD!')+` +$${isCr?'∞':pr}`;clr();uSh()};upPrice=()=>{if(isCr||money>=lv1*40){if(!isCr)money-=lv1*40;lv1++;uSh()}};upSize=()=>{if(isCr){lvC=(lvC+1)%4;clr();uSh()}else if(lvC<3&&money>=(lvC+1)*120){money-=(lvC+1)*120;lvC++;clr();uSh()}};</script></body></html>
